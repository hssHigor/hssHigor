<svg xmlns="http://www.w3.org/2000/svg" width="820" height="232" viewBox="0 0 820 232" role="img" aria-labelledby="title description">
  <title id="title">Higor Santos</title>
  <desc id="description">Terminal retrô com o comando whoami. Backend com Java, Spring Boot e SQL.</desc>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .command-mask { animation: type-command 1.05s steps(8, end) both; }
      .output { animation: show-output .25s ease-out 1.15s both; }
      .cursor { animation: blink 1.1s step-end 1.4s infinite; }
      .sweep { animation: sweep 7s linear infinite; }
    }

    @keyframes type-command {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @keyframes show-output {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes sweep {
      0% { opacity: .42; transform: translateY(-65px); }
      40%, 100% { opacity: .42; transform: translateY(195px); }
    }
  </style>
  <defs>
    <clipPath id="command-clip">
      <rect class="command-mask" x="0" y="0" width="118" height="32"/>
    </clipPath>
    <clipPath id="screen-clip">
      <rect x="2" y="47" width="816" height="183" rx="14"/>
    </clipPath>
    <linearGradient id="sweep-light" x2="0" y2="1">
      <stop stop-color="#7df6aa" stop-opacity="0"/>
      <stop offset=".86" stop-color="#7df6aa" stop-opacity=".18"/>
      <stop offset=".9" stop-color="#7df6aa" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7df6aa" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 3.5H4" stroke="#7df6aa" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect x="1" y="1" width="818" height="230" rx="16" fill="#091611" stroke="#34634e" stroke-width="2"/>
  <rect x="2" y="2" width="816" height="228" rx="15" fill="url(#scanlines)"/>
  <path d="M2 46h816" stroke="#34634e"/>
  <circle cx="24" cy="24" r="5" fill="#ee857f"/>
  <circle cx="42" cy="24" r="5" fill="#ecc674"/>
  <circle cx="60" cy="24" r="5" fill="#85eaa7"/>
  <g font-family="monospace">
    <text x="410" y="30" text-anchor="middle" fill="#acd2bc" font-size="16">higor@github:~</text>
    <g transform="translate(36 63)">
      <text x="0" y="24" fill="#83e9a3" font-size="24" textLength="116" lengthAdjust="spacingAndGlyphs" clip-path="url(#command-clip)">$ whoami</text>
    </g>
    <g class="output">
      <text x="36" y="147" fill="#afffc7" font-size="56" font-weight="700">Higor Santos</text>
      <text x="38" y="190" fill="#b8d8c6" font-size="26">Backend · Java · Spring Boot · SQL</text>
      <rect class="cursor" x="763" y="174" width="15" height="20" fill="#83e9a3"/>
    </g>
  </g>
  <g clip-path="url(#screen-clip)">
    <rect class="sweep" x="2" y="47" width="816" height="55" fill="url(#sweep-light)" opacity="0"/>
  </g>
</svg>
